name: Sync READMEs

on:
  workflow_dispatch:

jobs:
  sync-readmes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch README.md from target accounts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'PY'
          import os, pathlib, requests, base64
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from requests.exceptions import ChunkedEncodingError
          
          TOKEN = os.environ["GITHUB_TOKEN"]
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
          }
          BASE = "https://api.github.com"
          
          ACCOUNTS = [
              "data-hcp",
              "data-nih",
              "data-openneuro",
              "data-indi",
              "data-others"
          ]
          
          session = requests.Session()
          session.headers.update(HEADERS)
          session.mount("https://", HTTPAdapter(max_retries=Retry(
              total=5,
              backoff_factor=1,
              status_forcelist=[500, 502, 503, 504],
              raise_on_status=False
          )))
          
          def get_all(url, params=None):
              out = []
              while url:
                  r = session.get(url, params=params, timeout=30)
                  r.raise_for_status()
                  out.extend(r.json())
                  url = r.links.get("next", {}).get("url")
                  params = None
              return out
          
          def fetch_readme(account, repo, ref=None):
              url = f"{BASE}/repos/{account}/{repo}/readme"
              params = {"ref": ref} if ref else None
          
              r = session.get(url, params=params, timeout=30)
              if r.status_code == 404:
                  return None
              r.raise_for_status()
              data = r.json()
          
              if data.get("download_url"):
                  raw = session.get(data["download_url"], timeout=30)
                  raw.raise_for_status()
                  return raw.text
          
              # fallback to base64 API content
              content = data.get("content", "")
              if data.get("encoding") == "base64":
                  try:
                      return base64.b64decode(content).decode("utf-8", errors="replace")
                  except Exception:
                      return None
          
              return None
          
          root = pathlib.Path("mds")
          root.mkdir(exist_ok=True)
          
          for account in ACCOUNTS:
              print("Account:", account)
          
              repos = get_all(f"{BASE}/users/{account}/repos", params={"per_page": 100})
          
              for r in repos:
                  repo = r["name"]
                  default_branch = r.get("default_branch", "main")
          
                  print(f"  Repo: {account}/{repo}")
          
                  try:
                      text = fetch_readme(account, repo, ref=default_branch)
                      if not text:
                          print("   - No README found")
                          continue
          
                      # Save as: mds/account/repo.md
                      out_dir = root / account
                      out_dir.mkdir(parents=True, exist_ok=True)
          
                      out_file = out_dir / f"{repo}.md"
                      out_file.write_text(text, encoding="utf-8")
          
                      print(f"   + Saved mds/{account}/{repo}.md")
          
                  except Exception as e:
                      print(f"   ! Error fetching {account}/{repo}: {e}")
          
          PY

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mds || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync READMEs from data-* repos"
          git push
